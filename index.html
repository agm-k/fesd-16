<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FESD-16</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-bar">
  <img src="assets/fesd.jpg" class="logo" alt="FESD16">

  <div class="buttons">

    <a href="agm.html" class="btn">Equipo AGM</a>
  </div>
</header>

<main>
  <section class="news">
    <h2>Noticias de la Semana</h2>
    <div class="news-grid">
      <div class="news-card">Noticia 1</div>
      <div class="news-card">Noticia 2</div>

      <div class="news-card">Noticia 4</div>

      <div class="news-card">Noticia 6</div>
      <div class="news-card">Noticia 7</div>

  <section class="comments">

    <textarea id="commentText" placeholder="Escribe tu comentario..."></textarea>

</main>

<footer class="footer">
